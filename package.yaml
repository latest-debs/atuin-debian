# Package definition for atuin

package_name: atuin
github_repo: atuinsh/atuin
license: MIT
artifact_format: tar.gz
description: "Magical shell history"

# atuin's upstream release binaries link against a newer glibc than Debian
# bookworm ships (they require GLIBC_2.38; bookworm provides 2.36), so they
# cannot run on bookworm. Build for the newer suites only.
debian_distributions: ["trixie", "forky", "sid"]

# atuin's release bundles both the CLI (atuin-*) and the atuin-server
# (atuin-server-*) under matching architecture tokens (both e.g.
# "x86_64-unknown-linux-gnu") - auto-discovery can't tell them apart and
# could pick the server binary, so release patterns are pinned explicitly
# here, same reasoning as duckdb/bun/deno.
architectures:
  amd64:
    release_pattern: "atuin-x86_64-unknown-linux-gnu.tar.gz"
  arm64:
    release_pattern: "atuin-aarch64-unknown-linux-gnu.tar.gz"

# Opt into native Ubuntu builds (builder >= v.0.1a29). Packages without
# these are served from the Debian suites via the alias fallback.
ubuntu_distributions:
  - jammy
  - noble
  - resolute
